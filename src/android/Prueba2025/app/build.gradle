plugins {
    id 'com.android.application'
}

android {
    namespace 'org.jordi.prueba2025'
    compileSdk 34

    defaultConfig {
        applicationId "org.jordi.prueba2025"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
}

// Una sola versión de kotlin-stdlib: la 1.8.22 ya incluye las clases
// de jdk7/jdk8, así se evitan los "Duplicate class kotlin.*"
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
            details.because 'Evita clases Kotlin duplicadas en el APK'
        }
    }
}
