name: Verificar servidor y cliente
on: [push, pull_request, workflow_dispatch]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: prueba_ci
          MYSQL_DATABASE: pbio_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pprueba_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis PHP
        run: find src servidor -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Probar validación y adaptación REST
        run: php servidor/tests/rest.php
      - name: Probar proxy web
        run: node --test servidor/tests/medidas.test.mjs test/gui.test.mjs
      - name: Probar persistencia con MySQL real y rollback
        env:
          PBIO_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=pbio_test;charset=utf8mb4
          PBIO_TEST_DATABASE: pbio_test
          PBIO_TEST_USER: root
          PBIO_TEST_PASSWORD: prueba_ci
        run: php test/backend_integration.php
      - name: Probar migración MVP sin pérdida de medidas
        env:
          PBIO_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=pbio_test;charset=utf8mb4
          PBIO_TEST_DATABASE: pbio_test
          PBIO_TEST_USER: root
          PBIO_TEST_PASSWORD: prueba_ci
          PBIO_MIGRATION_FILE: bd/migrar_mvp.sql
        run: php test/migration_integration.php
      - name: Verificar paquete Plesk
        run: python scripts/preparar_plesk.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: false
      - name: Preparar SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compilar APK y ejecutar pruebas Android
        working-directory: Prueba2025
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sprint0-apk-y-pruebas
          path: |
            Prueba2025/app/build/outputs/apk/debug/*.apk
            Prueba2025/app/build/reports/tests/testDebugUnitTest/
